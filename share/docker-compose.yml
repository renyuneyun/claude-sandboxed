services:
  # The AI Sandboxed Runtime
  ai-agent:
    image: node:22-bookworm
    environment:
      - IS_SANDBOX=1  # Allows --dangerously-skip-permissions under root
    volumes:
      # 1. DYNAMIC MOUNT: Injected dynamically by the wrapper launcher
      - ${WORKSPACE_DIR}:/workspace
      # 2. PERSISTENT CACHE: Saves manual tools, packages, global settings, and histories
      - claude-agent-home:/root
      # 3. CC-SWITCH PASS-THROUGH: Links your local credential configurations
      - ${HOME}/.claude:/root/.claude
    working_dir: /workspace
    tty: true
    stdin_open: true
    # NOTE: host network mode is used for simplicity (e.g. accessing host proxy at 127.0.0.1:7890).
    # This means the container shares the host's network namespace — there is currently NO network
    # isolation. Improving network isolation is a future goal; see docs/architecture.md.
    network_mode: host
    # This runs once on startup to block git pushes globally across all workspaces
    entrypoint: >
      sh -c "
      git config --global core.sshCommand 'echo \"[SECURITY] Remote push operations are prohibited inside this sandbox.\" && false' &&
      git config --global url.'https://prohibited/'.insteadOf 'https://github.com/' &&
      git config --global url.'https://prohibited/'.insteadOf 'git@github.com:' &&
      tail -f /dev/null
      "

volumes:
  claude-agent-home:

